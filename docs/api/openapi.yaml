        daily:
          type: object
          properties:
            enabled:
              type: boolean
              description: ""
            time:
              type: string
              description: HH:MM
              pattern: ^([01]\d|2[0-3]):[0-5]\d$
            timezone:
              type: string
              description: IANA zone, e.g. Asia/Ho_Chi_Minh
            include:
              type: array
              items:
                type: string
                enum:
                  - clusters
                  - hosts
                  - services
                  - workers
        quiet_mode:
          type: object
          properties:
            enabled:
              type: boolean
              description: ""
            from:
              type: string
              description: HH:MM
            to:
              type: string
              description: HH:MM
      required:
        - periodic
        - daily
        - quiet_mode
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: xcr_session
      description: Session cookie set by `POST /sessions`. Unsafe requests of a signed-in user also need the `X-CSRF-Token` header.
