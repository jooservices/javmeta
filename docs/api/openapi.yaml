      tags:
        - Administration
      summary: Report schedule
      security:
        - cookieAuth: []
      x-scope: admin
      responses:
        "200":
          description: Report schedule
          headers:
            ETag:
              description: Version tag; send back as If-Match
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSchedule"
                  meta:
                    type: object
                    additionalProperties: true
              example:
                data:
                  periodic:
                    enabled: true
                    every_minutes: 360
                    include:
                      - clusters
                      - hosts
                  daily:
                    enabled: true
                    time: 08:00
                    timezone: Asia/Ho_Chi_Minh
                    include:
                      - clusters
                      - hosts
                  quiet_mode:
                    enabled: false
                    from: 23:00
                    to: 07:00
                meta: {}
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: putReportsSchedule
      tags:
        - Administration
      summary: Change the report schedule
      description: Validates IANA time zone (`invalid_timezone`), `HH:MM` (`invalid_time`), periodic cycle ≥ 15 minutes (`too_small`).
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag of the last read of this resource
          schema:
            type: string
      security:
        - cookieAuth: []
      x-scope: admin
      x-csrf: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportSchedule"
      responses:
        "200":
          description: Change the report schedule
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/ReportSchedule"
                  meta:
                    type: object
                    additionalProperties: true
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: If-Match does not match the current version
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "428":
          description: If-Match header is required
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
