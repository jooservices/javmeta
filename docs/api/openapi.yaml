openapi: 3.1.0
info:
  title: XCrawler UI API
  version: 1.0.0
  summary: REST API behind the XCrawler web application (catalogue, search, personal area, library, Command Center, administration).
  description: |-
    Single contract between the React application and the Laravel backend. The Fastify reference implementation in `.tmp/xcr/live/server` serves exactly these operations and is the behavioural reference for the contract tests.

    ## Conventions
    - Base path `/api/v2`. JSON, UTF-8, `snake_case`, ISO-8601 UTC timestamps, dates `YYYY-MM-DD`.
    - Success envelope `{ "data": ..., "meta": {...}, "links": {...}? }`. Collections add `meta.pagination` (`page`, `per_page`, `total`, `pages`).
    - Errors are RFC 9457 `application/problem+json` with a stable machine `code`; validation errors (422) carry `errors[{field, code}]`.
    - Credentials: cookie session `xcr_session` (HttpOnly, SameSite=Lax). Every unsafe request of a signed-in user needs `X-CSRF-Token` (value returned by `POST /sessions` and `GET /sessions/current`). A few computation-only POSTs are exempt (marked in the operation).
    - Scopes: `public` (guest allowed), `owner` (signed-in user), `admin` (administrator or super administrator). A guest calling an owner/admin operation gets 401, a signed-in user without the scope gets 403.
    - Sign-in required: while the installation setting `ui_security.login_required` is on (the default) a guest may only call the session and password-reset operations, the contract and the download requests; every other `public` operation then answers 401. Turn it off and every `public` operation is open to guests.
    - Optimistic locking: `PUT` of settings groups, notification templates and the report schedule need `If-Match` with the `ETag` of the last read (`412` when stale, `428` when missing).
    - Pagination: `page` + `per_page`. Sorting and filtering use plain, readable query parameters (the same names as the web UI URLs).
    - Images are hot-linked: `*_url` fields point to the original hosts and the browser sends no referrer.
    - Rate limits: sign-in 10/min, password reset 5/min, download requests 8/min, view counter 60/min per IP.
servers:
  - url: /api/v2
    description: Same origin as the web application
tags:
  - name: Sessions
    description: Sign-in, sign-out, current session, password reset
  - name: Users
    description: User accounts (administrator)
  - name: Movies
    description: Movie list, facets, detail and sub-resources
  - name: Performers
    description: Performer list, facets, profile and sub-resources
  - name: Catalogs
    description: Genres, makers, series, labels, years, cups, blood types, locations
  - name: Search
    description: Unified search, suggestions, query interpretation, photos
  - name: Discovery
    description: Updates feed, highlights, calendar
  - name: Statistics
    description: Numbers and charts
  - name: Me
    description: "The signed-in user: profile, preferences, marks, follows, feed, saved searches, history"
  - name: Download requests
    description: Requests for download links (guests allowed)
  - name: Library
    description: Library files, download queue, media jobs, playback
  - name: Operations
    description: "Command Center: sources, runs, queue, events, nodes, infrastructure, alerts, review flags"
  - name: Administration
    description: API keys, settings, notification templates, reports
  - name: System
    description: Health and public summary
paths:
  /sessions:
    post:
      operationId: postSessions
      tags:
        - Sessions
      summary: Sign in
      description: Sets the `xcr_session` cookie (14 days). Rate limited to 10 per minute per IP.
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email
                password:
                  type: string
                  description: Password
              required:
                - email
                - password
      responses:
        "201":
          description: Sign in (created)
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      scope:
                        type: string
                        enum:
                          - owner
                          - admin
                      csrf:
                        type: string
                        description: CSRF token for later unsafe requests
                    required:
                      - user
                      - scope
                      - csrf
                  meta:
                    type: object
                    additionalProperties: true
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /sessions/current:
    get:
      operationId: getSessionsCurrent
      tags:
        - Sessions
      summary: Current session
      description: "Bootstraps the application: who is calling and what they may do. Always answers 200, also for guests."
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      scope:
                        type: string
                        enum:
                          - guest
                          - owner
                          - admin
                      user:
                        anyOf:
                          - $ref: "#/components/schemas/User"
                          - type: "null"
                      csrf:
                        type: string
                        description: Only when signed in
                      preferences:
                        type: object
                        description: "UI preferences of the user (keys: language, density, privacy, shortcuts, stats_hidden, view_mode, page_size)"
                        additionalProperties: true
                      login_required:
                        type: boolean
                        description: Whether the site requires sign-in
                    required:
                      - scope
                      - user
                      - login_required
                  meta:
                    type: object
                    additionalProperties: true
    delete:
      operationId: deleteSessionsCurrent
      tags:
        - Sessions
      summary: Sign out
      description: Clears the session cookie.
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      responses:
        "204":
          description: Done, no content
  /password-resets:
    post:
      operationId: postPasswordResets
      tags:
        - Sessions
      summary: Request a password reset
      description: Answers 202 whether or not the address exists (no account enumeration). In the demo no mail is sent.
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email
              required:
                - email
      responses:
        "202":
          description: Request a password reset (accepted)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                        description: Always true
                  meta:
                    type: object
                    additionalProperties: true
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /password-resets/{token}:
    put:
      operationId: putPasswordResetsToken
      tags:
        - Sessions
      summary: Set a new password with a reset token
      description: Token is valid for one hour and single use.
      parameters:
        - name: token
          in: path
          required: true
          description: Token from the reset link
          schema:
            type: string
            description: Reset token
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: New password, at least 8 characters
                  minLength: 8
              required:
                - password
      responses:
        "204":
          description: Done, no content
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users:
    get:
      operationId: getUsers
      tags:
        - Users
      summary: List users
      security:
        - cookieAuth: []
      x-scope: admin
      responses:
        "200":
          description: List users
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    type: object
                    additionalProperties: true
              example:
                data:
                  - id: 1
                    name: Super Administrator
                    email: soulevilx@gmail.com
                    role: super_administrator
                    scope: admin
                    created_at: 2026-10-23T15:27:33.000Z
                meta: {}
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: postUsers
      tags:
        - Users
      summary: Create a user
      description: Header `Location` points to the new user. Needs `X-CSRF-Token` when signed in.
      security:
        - cookieAuth: []
      x-scope: admin
      x-csrf: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Display name
                email:
                  type: string
                  description: Email
                  format: email
                password:
                  type: string
                  description: At least 8 characters
                  minLength: 8
                role:
                  type: string
                  enum:
                    - user
                    - admin
                    - super_administrator
                  description: Default `user`
              required:
                - name
                - email
                - password
      responses:
        "201":
          description: Create a user (created)
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
                    additionalProperties: true
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: State conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{id}:
    patch:
      operationId: patchUsersId
      tags:
        - Users
      summary: Change a user
      description: "JSON merge patch: send only the fields to change."
      parameters:
        - name: id
          in: path
          required: true
          description: User id
          schema:
            type: integer
            description: User id
      security:
        - cookieAuth: []
      x-scope: admin
      x-csrf: required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name
                email:
                  type: string
                  description: Email
                role:
                  type: string
                  enum:
                    - user
                    - admin
                    - super_administrator
                  description: Role
                password:
                  type: string
                  description: New password
                  minLength: 8
      responses:
        "200":
          description: Change a user
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
                    additionalProperties: true
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (see `errors`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteUsersId
      tags:
        - Users
      summary: Delete a user
      description: A user cannot delete their own account (`cannot_delete_self`).
      parameters:
        - name: id
          in: path
          required: true
          description: User id
          schema:
            type: integer
            description: User id
      security:
        - cookieAuth: []
      x-scope: admin
      x-csrf: required
      responses:
        "204":
          description: Done, no content
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Signed in but not allowed (wrong scope or missing/invalid CSRF token)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: State conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /movies:
    get:
      operationId: getMovies
      tags:
        - Movies
      summary: List movies
      description: One filter language shared with the web UI. Performer-profile filters narrow movies by who is in the cast.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            description: Page number, starting at 1
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            description: Items per page (max 96)
            minimum: 1
            maximum: 96
            default: 24
        - name: sort
          in: query
          required: false
          description: Sort order. Default `release_date (relevance when q is set)`. `relevance` ranks an exact code match first.
          schema:
            type: string
            enum:
              - relevance
              - release_date
              - update_date
              - rating
              - runtime
              - code
            description: Sort key
        - name: q
          in: query
          required: false
          description: Free text
          schema:
            type: string
            description: Words, matched against code, titles, maker, series and cast names; every word must match
        - name: genre
          in: query
          required: false
          description: Genres
          schema:
            type: string
            description: Genre names (comma-separated for several values)
        - name: genre_all
          in: query
          required: false
          description: "Genre mode: all"
          schema:
            type: string
            enum:
              - "1"
            description: When `1`, a movie must have every listed genre
        - name: genre_not
          in: query
          required: false
          description: Excluded genres
          schema:
            type: string
            description: Genre names to exclude (comma-separated for several values)
        - name: maker
          in: query
          required: false
          description: Maker
          schema:
            type: string
            description: Maker name (substring, case-insensitive)
        - name: series
          in: query
          required: false
          description: Series
          schema:
            type: string
            description: Series name (substring)
        - name: label
          in: query
          required: false
          description: Label
          schema:
            type: string
            description: Label name (substring)
        - name: actress_id
          in: query
          required: false
          description: Movies that have all the listed performers (several ids = shared movies)
          schema:
            type: string
            description: Performer ids (comma-separated for several values)
        - name: code
          in: query
          required: false
          description: Code contains
          schema:
            type: string
            description: Part of the movie code
        - name: released_from
          in: query
          required: false
          description: Released from year
          schema:
            type: integer
            description: Earliest release year
        - name: released_to
          in: query
          required: false
          description: Released to year
          schema:
            type: integer
            description: Latest release year
        - name: runtime_min
          in: query
          required: false
          description: Runtime ≥
          schema:
            type: integer
            description: Minimum runtime in minutes
        - name: runtime_max
          in: query
          required: false
          description: Runtime ≤
          schema:
            type: integer
            description: Maximum runtime in minutes
        - name: crawled_days
          in: query
          required: false
          description: Recently collected
          schema:
            type: integer
            description: Collected within the last N days
        - name: score_min
          in: query
          required: false
          description: Score ≥
          schema:
            type: number
            description: Minimum community score (0–10)
        - name: tier_min
          in: query
          required: false
          description: Tier ≥
          schema:
            type: integer
            description: Minimum completeness tier (1–3)
        - name: censored
          in: query
          required: false
          description: Censorship
          schema:
            type: string
            enum:
              - censored
              - uncensored
            description: Censorship
        - name: has_magnet
          in: query
          required: false
          description: Has download links
          schema:
            type: string
            enum:
              - "1"
              - "0"
            description: "`1` has download links, `0` has none"
        - name: has_performers
          in: query
          required: false
          description: Has performers
          schema:
            type: string
            enum:
              - "1"
            description: Has at least one performer
        - name: has_watch
          in: query
          required: false
          description: Has preview
          schema:
            type: string
            enum:
              - "1"
            description: Has an HLS preview stream
        - name: source
          in: query
          required: false
          description: Seen on source
          schema:
            type: string
            description: Source slugs (comma-separated for several values)
        - name: has_profile
          in: query
          required: false
          description: Has profile — keeps movies that have a performer matching it
          schema:
            type: string
            enum:
              - "1"
              - "0"
            description: Has any profile field (birth, size, cup, blood, location, debut)
        - name: bio_q
          in: query
          required: false
          description: Biography contains — keeps movies that have a performer matching it
          schema:
            type: string
            description: Words that must appear in the biography text
        - name: age_min
          in: query
          required: false
          description: Age ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Minimum age in years
        - name: age_max
          in: query
          required: false
          description: Age ≤ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Maximum age in years
        - name: debut_from
          in: query
          required: false
          description: Debut from — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Earliest debut year
        - name: debut_to
          in: query
          required: false
          description: Debut to — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Latest debut year
        - name: cup
          in: query
          required: false
          description: Cup — keeps movies that have a performer matching it
          schema:
            type: string
            description: Cup letters (comma-separated for several values)
        - name: blood_type
          in: query
          required: false
          description: Blood type — keeps movies that have a performer matching it
          schema:
            type: string
            description: "Blood types: A, B, AB, O (comma-separated for several values)"
        - name: location
          in: query
          required: false
          description: Lives in — keeps movies that have a performer matching it
          schema:
            type: string
            description: Location (substring)
        - name: height_min
          in: query
          required: false
          description: Height ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: height_max
          in: query
          required: false
          description: Height ≤ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: born_from
          in: query
          required: false
          description: Born from — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Earliest birth year
        - name: born_to
          in: query
          required: false
          description: Born to — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Latest birth year
        - name: bust_min
          in: query
          required: false
          description: Bust ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: bust_max
          in: query
          required: false
          description: Bust ≤ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: waist_min
          in: query
          required: false
          description: Waist ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: waist_max
          in: query
          required: false
          description: Waist ≤ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: hip_min
          in: query
          required: false
          description: Hip ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: hip_max
          in: query
          required: false
          description: Hip ≤ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: cm
        - name: status
          in: query
          required: false
          description: Active or retired — keeps movies that have a performer matching it
          schema:
            type: string
            enum:
              - active
              - retired
            description: Activity
        - name: has_image
          in: query
          required: false
          description: Has photo — keeps movies that have a performer matching it
          schema:
            type: string
            enum:
              - "1"
              - "0"
            description: Has a photo
        - name: has_bio
          in: query
          required: false
          description: Has biography — keeps movies that have a performer matching it
          schema:
            type: string
            enum:
              - "1"
              - "0"
            description: Has a biography text
        - name: movies_min
          in: query
          required: false
          description: Movies ≥ — keeps movies that have a performer matching it
          schema:
            type: integer
            description: Minimum number of movies
      security:
        - {}
        - cookieAuth: []
      x-scope: public
      responses:
        "200":
          description: List movies
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MovieSummary"
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/PagedMeta"
              example:
                data:
                  - code: NAMH-082
                    title: アイドル美膣に濃密13発 完全ノーカット真正中出し解禁 春乃るる
                    title_jp: アイドル美膣に濃密13発 完全ノーカット真正中出し解禁 春乃るる
