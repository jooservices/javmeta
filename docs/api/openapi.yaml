components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
        title:
          type: string
          description: Short summary
        status:
          type: integer
          description: HTTP status
        code:
          type: string
          description: Stable machine code, e.g. `movie_not_found`, `validation_failed`
        detail:
          type: string
          description: Human readable explanation (English)
        instance:
          type: string
          description: The request URL
        trace_id:
          type: string
          description: Value of the X-Request-Id response header
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Field name or dotted path
              code:
                type: string
                description: e.g. `required`, `invalid`, `too_short`, `out_of_range`, `unknown_variable`
              min:
                type: number
                description: Lower bound when relevant
              max:
                type: number
                description: Upper bound when relevant
            required:
              - field
              - code
          description: Only on 422
      required:
        - type
        - title
        - status
        - code
      description: RFC 9457 problem details
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page
        per_page:
          type: integer
          description: Items per page
        total:
          type: integer
          description: Total items for the current filter
        pages:
          type: integer
          description: Total pages
      required:
        - page
        - per_page
        - total
        - pages
    PerformerSummary:
      type: object
      properties:
