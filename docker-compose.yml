x-app-volumes: &app-volumes
  - .:/var/www/html
  - ../client:/var/www/client:ro
  - ../dto:/var/www/dto:ro
  - ../exceptions:/var/www/exceptions:ro
  - ../laravel-controller:/var/www/laravel-controller:ro
  - ../laravel-repository:/var/www/laravel-repository:ro
  - playwright-browsers:/ms-playwright

x-app-environment: &app-environment
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-jvmeta}
  DB_USERNAME: ${DB_USERNAME:-jvmeta}
  DB_PASSWORD: ${DB_PASSWORD:-jvmeta}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  MONGO_URI: ${MONGO_URI:-}
  MONGO_HOST: ${MONGO_HOST:-mongo}
  MONGO_PORT: ${MONGO_PORT:-27017}
  MONGO_DATABASE: ${MONGO_DATABASE:-javmeta_archive}
  ACTIVITY_LOG_CONNECTION: ${ACTIVITY_LOG_CONNECTION:-mongodb}
  ACTIVITY_LOG_COLLECTION: ${ACTIVITY_LOG_COLLECTION:-activity_logs}
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-http://elasticsearch:9200}
  ELASTICSEARCH_MOVIES_INDEX: ${ELASTICSEARCH_MOVIES_INDEX:-javmeta_movies}
  ELASTICSEARCH_PERFORMERS_INDEX: ${ELASTICSEARCH_PERFORMERS_INDEX:-javmeta_performers}
  EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8000}
  EMBEDDER_DIM: ${EMBEDDER_DIM:-384}
  CRAWLERX_ROOT: /var/www/html/vendor/jooservices/crawlerx
  CRAWLERX_NODE: node
  CRAWLERX_PLAYWRIGHT_SCRIPT: /var/www/html/vendor/jooservices/crawlerx/scripts/playwright-fetch.mjs
  CRAWLERX_PUPPETEER_SCRIPT: /var/www/html/vendor/jooservices/crawlerx/scripts/puppeteer-stealth-fetch.mjs
  FLARESOLVERR_URL: ${FLARESOLVERR_URL:-${CRAWLERX_FLARESOLVERR_URL:-http://flaresolverr:8191/v1}}
  PLAYWRIGHT_URL: ${PLAYWRIGHT_URL:-}
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${REDIS_PORT:-16382}
  JAVMETA_WORKERS_PER_QUEUE: ${JAVMETA_WORKERS_PER_QUEUE:-1}
  JAVMETA_QUEUE_NAMES: ${JAVMETA_QUEUE_NAMES:-listing,detail,performer_listing,performer_detail,gallery,search}
  OPENOBSERVE_ENABLED: ${OPENOBSERVE_ENABLED:-true}
  OPENOBSERVE_URL: ${OPENOBSERVE_URL:-http://openobserve:5080}
  OPENOBSERVE_ORG: ${OPENOBSERVE_ORG:-default}
  OPENOBSERVE_STREAM_LOGS: ${OPENOBSERVE_STREAM_LOGS:-javmeta_logs}
  OPENOBSERVE_STREAM_METRICS: ${OPENOBSERVE_STREAM_METRICS:-javmeta_metrics}

x-worker: &worker
  image: jooservices/javmeta:php85
  working_dir: /var/www/html
  command: ["sh", "-ec", "if [ \"$${QUEUE_CONNECTION:-redis}\" = redis ]; then exec php artisan horizon; else exec crawlerx-fetch-ready worker-queues; fi"]
  env_file:
    - .env
  environment:
    <<: *app-environment
  volumes: *app-volumes
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "if [ \"$${QUEUE_CONNECTION:-redis}\" = redis ]; then php artisan horizon:status; else kill -0 1; fi"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  profiles:
    - app

services:
  api:
    build:
      context: .
      args:
        SENTRY_RELEASE: ${SENTRY_RELEASE:-unknown}
    image: jooservices/javmeta:php85
    working_dir: /var/www/html
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    env_file:
      - .env
    environment:
      <<: *app-environment
      JAVMETA_ROLE: api
    volumes: *app-volumes
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health/live >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles:
      - app

  worker:
    <<: *worker
    environment:
      <<: *app-environment
      JAVMETA_ROLE: worker

  embedder:
    build:
      context: ./embedder
    image: jooservices/javmeta-embedder:latest
    ports:
      - "${EMBEDDER_HOST_PORT:-8000}:8000"
    restart: unless-stopped
    profiles:
      - embed

  scheduler:
    image: jooservices/javmeta:php85
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      <<: *app-environment
      JAVMETA_ROLE: scheduler
    volumes: *app-volumes
    restart: unless-stopped
    profiles:
      - control

  mcp:
    image: jooservices/javmeta:php85
    working_dir: /var/www/html
    command: ["php", "artisan", "mcp:serve"]
    env_file:
      - .env
    environment:
      <<: *app-environment
      JAVMETA_ROLE: mcp
    volumes: *app-volumes
    stdin_open: true
    tty: true
    restart: unless-stopped
    profiles:
      - control
      - mcp

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jvmeta}
      POSTGRES_USER: ${DB_USERNAME:-jvmeta}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jvmeta}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jvmeta} -d ${DB_DATABASE:-jvmeta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data
    profiles:
      - data

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-db-data:/data/db
    profiles:
      - data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    ports:
      - "${ELASTICSEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - ./data/elasticsearch/data:/usr/share/elasticsearch/data
    profiles:
      - data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.1
    environment:
      LOG_LEVEL: info
      HEADLESS: "true"
    ports:
      - "8191:8191"
    restart: unless-stopped
    profiles:
      - flare

  openobserve:
    image: openobserve/openobserve:v0.92.0
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@javmeta.local}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
    ports:
      - "5080:5080"
    volumes:
      - ./data/openobserve:/data
    restart: unless-stopped
    profiles:
      - openobserve

volumes:
  playwright-browsers:
  mongo-db-data:
