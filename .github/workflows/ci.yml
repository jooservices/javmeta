# Quality gate for jooservices/javmeta — GitHub-hosted runners only.
# Runs the same commands as the local gate through docker/ci/run.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: docker build --tag javmeta-ci:local --file docker/ci/Dockerfile docker/ci

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.json', 'composer.lock', 'docker/ci/Dockerfile') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer install --no-interaction --prefer-dist --no-progress

      - name: Composer validate
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer validate --strict

      - name: Lint (Pint, PHPCS, PHPMD, PHPStan, PHP-CS-Fixer)
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer lint

      - name: Test with coverage
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer test:coverage

      - name: Coverage check (minimum 85%)
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer coverage:check

      - name: Upload coverage report
        if: always() && hashFiles('build/coverage.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: build/coverage.xml
          retention-days: 7

  integration:
    name: Integration (Postgres, Mongo, Elasticsearch, OpenObserve)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build CI image
        run: docker build --tag javmeta-ci:local --file docker/ci/Dockerfile docker/ci

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: vendor-cache
        with:
          path: vendor
          key: composer-vendor-${{ hashFiles('composer.json', 'composer.lock', 'docker/ci/Dockerfile') }}

      - name: Install dependencies
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/run composer install --no-interaction --prefer-dist --no-progress

      - name: Run integration suite
        env:
          JAVMETA_CI_SKIP_BUILD: '1'
        run: docker/ci/integration

  secrets:
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --source . --redact --config=.gitleaks.toml --exit-code 1

  app-image:
    name: Build app image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Dockerfile.production (no push)
        run: docker build --tag javmeta:ci --file Dockerfile.production .

      - name: Report image size
        run: docker image inspect javmeta:ci --format '{{.Size}}' | numfmt --to=iec
