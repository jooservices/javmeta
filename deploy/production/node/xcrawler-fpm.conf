[@SERVICE_USER@]
user = @SERVICE_USER@
group = @SERVICE_USER@
listen = /run/php/@SERVICE_USER@.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
clear_env = yes
catch_workers_output = yes
