# TLS terminates on the existing gatekeeper; allow only its private address to reach this node.
server {
    listen 80;
    server_name xcrawler.net;
    root /var/www/xcrawler/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 32m;
    set_real_ip_from 192.168.10.4;
    real_ip_header X-Forwarded-For;
    allow 192.168.10.4;
    deny all;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/xcrawler.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
