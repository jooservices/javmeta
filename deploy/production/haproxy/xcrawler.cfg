# Merge into the existing HTTPS frontend before generic use_backend/default_backend.
# Existing frontend owns bind/certificates and the port-80 ACME exception; this is a snippet.
acl xcrawler_ui hdr(host) -i xcrawler.net xcrawler.net:443
acl xcrawler_cc hdr(host) -i cc.xcrawler.net cc.xcrawler.net:443
# Match the decoded path and reject dot/duplicate-slash paths before nginx normalizes them.
acl xcrawler_noncanonical path,url_dec -m reg (^|/)[.][.]?(/|$) //
acl xcrawler_ops path,url_dec -m reg -i ^/(ops|horizon|vendor/horizon)(/|$)
acl xcrawler_cc_root path -i /
acl xcrawler_cc_paths path,url_dec -m reg -i ^/(ops|horizon|vendor/horizon|login|logout)(/|$)
http-request deny deny_status 404 if xcrawler_ui xcrawler_noncanonical
http-request deny deny_status 404 if xcrawler_cc xcrawler_noncanonical
http-request deny deny_status 404 if xcrawler_ui xcrawler_ops
http-request deny deny_status 404 if xcrawler_cc !xcrawler_cc_root !xcrawler_cc_paths
http-request set-header X-Forwarded-Proto https if xcrawler_ui
http-request set-header X-Forwarded-Proto https if xcrawler_cc
use_backend xcrawler_node if xcrawler_ui
use_backend xcrawler_node if xcrawler_cc

backend xcrawler_node
    mode http
    option forwardfor
    server xcrawler 192.168.10.20:80 check
