name: javmeta-monitoring

services:
  node-exporter:
    image: prom/node-exporter:v1.9.1
    pid: host
    network_mode: host
    command:
      - --path.rootfs=/host
      - --collector.pressure
    volumes:
      - /:/host:ro
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    ports:
      - "${CADVISOR_HOST_PORT:-8081}:8080"
    command:
      - --docker_only=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=agent
      - --storage.agent.path=/prometheus
    environment:
      OBS_URL: ${OBS_URL:-http://openobserve:5080}
      OBS_ORG: ${OBS_ORG:-default}
      OBS_USERNAME: ${OBS_USERNAME:-replace-with-observe-username}
      OBS_PASSWORD: ${OBS_PASSWORD:-replace-with-observe-password}
      JAVMETA_NODE_NAME: ${JAVMETA_NODE_NAME:-node-example}
      JAVMETA_NODE_ROLE: ${JAVMETA_NODE_ROLE:-crawler}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - monitoring

volumes:
  prometheus-data:

configs:
  prometheus-config:
    content: |
      global:
        scrape_interval: 15s
        external_labels:
          node: "${JAVMETA_NODE_NAME:-node-example}"
          role: "${JAVMETA_NODE_ROLE:-crawler}"

      scrape_configs:
        - job_name: node-exporter
          static_configs:
            - targets: ["host.docker.internal:9100"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]

      remote_write:
        - url: "${OBS_URL:-http://openobserve:5080}/api/${OBS_ORG:-default}/prometheus/api/v1/write"
          basic_auth:
            username: "${OBS_USERNAME:-replace-with-observe-username}"
            password: "${OBS_PASSWORD:-replace-with-observe-password}"

networks:
  monitoring:
    name: ${JAVMETA_MONITORING_NETWORK:-javmeta-monitoring-network}
    ipam:
      config:
        - subnet: ${JAVMETA_MONITORING_SUBNET:-10.254.0.0/24}
