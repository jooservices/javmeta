# Selected rules adapted from samber/awesome-prometheus-alerts Redis rules (CC BY 4.0):
# https://samber.github.io/awesome-prometheus-alerts/rules/databases/redis/
groups:
  - name: redis-exporter
    rules:
      - alert: RedisExporterDown
        expr: up{job="redis_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          value: "{{ $value }}"
          summary: Redis exporter target is down
          description: "Prometheus cannot scrape the Redis exporter.\n  VALUE = {{ $value }}"
          runbook: https://wiki.jooservices.local/runbooks/redis#availability
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          value: "{{ $value }}"
          summary: Redis is unreachable from its exporter
          description: "The exporter is running but cannot query Redis.\n  VALUE = {{ $value }}"
          runbook: https://wiki.jooservices.local/runbooks/redis#availability
      - alert: RedisMaxmemoryNotConfigured
        expr: redis_memory_max_bytes == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          value: "{{ $value }}"
          summary: Redis has no configured memory limit
          description: "Redis maxmemory is unlimited; review the host and workload budget.\n  VALUE = {{ $value }}"
          runbook: https://wiki.jooservices.local/runbooks/redis#memory
      - alert: RedisOutOfConfiguredMaxmemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90 and on(instance) redis_memory_max_bytes > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          value: "{{ $value }}"
          summary: Redis is above 90% of configured maxmemory
          description: "Redis data memory is approaching its configured limit.\n  VALUE = {{ $value }}%"
          runbook: https://wiki.jooservices.local/runbooks/redis#memory
      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[1m]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          value: "{{ $value }}"
          summary: Redis is rejecting client connections
          description: "More than five client connections were rejected in the last minute.\n  VALUE = {{ $value }}"
          runbook: https://wiki.jooservices.local/runbooks/redis#connections
