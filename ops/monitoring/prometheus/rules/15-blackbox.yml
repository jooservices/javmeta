groups:
  - name: blackbox-exporter
    rules:
      - alert: BlackboxProbeFailed
        expr: probe_success{job="blackbox_http"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          value: "{{ $value }}"
          summary: HTTP or HTTPS probe failed for {{ $labels.instance }}
          description: "Blackbox probe failed for at least two minutes.\n  VALUE = {{ $value }}"
          runbook: https://wiki.jooservices.local/runbooks/monitoring#blackbox
      - alert: BlackboxTlsCertificateExpiresSoon
        expr: 'probe_success{job="blackbox_http",instance=~"https://.*"} == 1 and (probe_ssl_earliest_cert_expiry{job="blackbox_http",instance=~"https://.*"} - time()) < 14 * 24 * 60 * 60'
        for: 1h
        labels:
          severity: warning
        annotations:
          value: "{{ $value }}"
          summary: TLS certificate expires within 14 days for {{ $labels.instance }}
          description: "The probed TLS certificate is near expiration.\n  VALUE = {{ $value }} seconds"
          runbook: https://wiki.jooservices.local/runbooks/monitoring#tls-expiry
