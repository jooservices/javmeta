global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, vm_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: telegram
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: telegram
      repeat_interval: 4h
    - matchers: ['severity="info"']
      receiver: telegram
      group_by: [severity]
      repeat_interval: 24h
      active_time_intervals: [daily-info-digest]

time_intervals:
  - name: daily-info-digest
    time_intervals:
      - times:
          - start_time: "08:00"
            end_time: "08:15"
        location: Asia/Bangkok

inhibit_rules:
  - source_matchers: ['alertname="XcrawlerNodeDown"']
    target_matchers: ['alertname!="XcrawlerNodeDown"']
    equal: [vm_name]
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, vm_name]

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id_file: /etc/alertmanager/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.message" . }}'

templates:
  - /etc/alertmanager/templates/*.tmpl
